<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blackjack</title>
        <link rel="stylesheet" href="blackjack.css">
    </head>
    <body>
        <header>
            <h1>Blackjack</h1>
        </header>

        <main>
            <section id="gioco">
                <div id="mano-giocatore" class="mano">
                    <h2>Mano del giocatore</h2>
                    <div id="carte-giocatore" class="carte"></div>
                    <p>Totale: <span id="totale-giocatore">0</span></p>
                </div>

                <div id="mano-dealer" class="mano">
                    <h2>Mano del dealer</h2>
                    <div id="carte-dealer" class="carte"></div>
                    <p>Totale: <span id="totale-dealer">0</span></p>
                </div>

                <div id="controlli">
                    <button id="pulsante-pesca" onclick="pescaGiocatore()">Pesca</button>
                    <button id="pulsante-stai" onclick="stai()">Stai</button>
                    <button id="nuova-partita" onclick="nuovaPartita()">Nuova partita</button>
                </div>
                <div id="risultato"></div>
            </section>
        </main>
    <script src="blackjack.js"></script>
        
    </body>
</html>
