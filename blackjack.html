<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blackjack</title>
        <link rel="stylesheet" href="blackjack.css">
    </head>
    <body>
        <header>
            <h1>Blackjack</h1>
        </header>

        <main>
            <section id="gioco">
                <div id="mano-giocatore" class="mano">
                    <h2>Mano del giocatore</h2>
                    <div id="carte-giocatore" class="carte"></div>
                    <p>Totale: <span id="totale-giocatore">0</span></p>
                </div>

                <div id="mano-dealer" class="mano">
                    <h2>Mano del dealer</h2>
                    <div id="carte-dealer" class="carte"></div>
                    <p>Totale: <span id="totale-dealer">0</span></p>
                </div>

                <div id="controlli">
                    <section id="scommessa">
                        <h2>Scegli puntata</h2>
                        <p>Seleziona le fiches che desideri scommettere:</p>
                        <p>Saldo: <strong><span id="saldo">1000</span> fiches</strong></p>
                        <div id="fiches">
                            <button class="fiche" data-valore="1">1 fiche</button>
                            <button class="fiche" data-valore="5">5 fiches</button>
                            <button class="fiche" data-valore="10">10 fiches</button>
                            <button class="fiche" data-valore="25">25 fiches</button>
                            <button class="fiche" data-valore="50">50 fiches</button>
                            <button class="fiche" data-valore="100">100 fiches</button>
                        </div>
                        <p>Puntata totale: <span id="puntata-totale">0</span></p>
                        <button id="conferma-puntata" disabled>Conferma puntata</button>
                    </section>
                    <button id="pulsante-pesca">Pesca</button>
                    <button id="pulsante-stai">Stai</button>
                    <button id="nuova-partita">Nuova partita</button>
                </div>
                <div id="risultato"></div>
            </section>
        </main>
    <script src="blackjack.js"></script>
        
    </body>
</html>
